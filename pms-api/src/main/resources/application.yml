# PMS 酒店管理系统配置
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: pms-hotel

  # 数据源配置
  datasource:
    url: jdbc:postgresql://${PMS_DB_URL:localhost:5432}/${PMS_DB_NAME:hotel_pms}
    username: ${PMS_DB_USERNAME:postgres}
    password: ${PMS_DB_PASSWORD:postgres}
  # Redis配置
  data:
    redis:
      host: ${PMS_REDIS_HOST:localhost}
      port: ${PMS_REDIS_PORT:6379}
      password: ${PMS_REDIS_PASSWORD:}
      database: 0

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hotel.pms.dao.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

# Flyway配置
spring.flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true

# Swagger配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# PMS自定义配置
pms:
  auth:
    token-secret: ${PMS_AUTH_TOKEN_SECRET:pms-hotel-secret-key-at-least-32-chars}
    token-expire: ${PMS_AUTH_TOKEN_EXPIRE:86400}

# 日志配置
logging:
  level:
    root: INFO
    com.hotel.pms: DEBUG
    com.hotel.pms.dao.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
